name: CI/CD Hostinger VPS

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script
        run: bash -n deploy/deploy.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package API
        run: bash mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate container builds
        run: |
          docker build -t ecommerce-api:ci .
          docker build -f frontend/Dockerfile -t ecommerce-web:ci .

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PATH: ${{ vars.VPS_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$VPS_PATH" != / && "$VPS_PATH" != *..* ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Send tested source and deploy
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o release.tar.gz HEAD
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" release.tar.gz "$VPS_USER@$VPS_HOST:$VPS_PATH/release-$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH' && tar -xOf 'release-$GITHUB_SHA.tar.gz' deploy/deploy.sh | bash -s -- '$VPS_PATH' '$GITHUB_SHA'"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
