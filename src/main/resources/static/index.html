<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | E-commerce</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20242b; background: #f7f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #172a3a; color: white; padding: 2.4rem max(1.5rem, calc((100vw - 1100px) / 2)); }
    header p { margin: .25rem 0 0; color: #d6e3eb; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.7rem); letter-spacing: -.04em; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    h2 { margin: 0 0 1rem; font-size: 1.3rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: .5rem; border-bottom: 1px solid #d7d9da; padding-bottom: .8rem; margin-bottom: 1.5rem; }
    .tabs button { border: 1px solid #ccd1d2; border-radius: 999px; background: #fff; color: #253446; padding: .65rem 1rem; font: inherit; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: #172a3a; color: white; border-color: #172a3a; }
    .tabs button:focus-visible { outline: 3px solid #e1a33c; outline-offset: 3px; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    article { background: #fff; border: 1px solid #e1e3e4; border-radius: 14px; padding: 1.3rem; min-height: 180px; box-shadow: 0 4px 16px rgb(22 39 51 / 4%); }
    article h3 { margin: .5rem 0; font-size: 1.15rem; }
    article p { margin: .5rem 0; color: #52606b; line-height: 1.5; }
    .category { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #7b530e; }
    .price { display: block; margin-top: 1rem; font-size: 1.25rem; font-weight: 750; color: #183f31; }
    .status { color: #52606b; }
    .out { color: #a2392f; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Catálogo</h1>
    <p>Explore os produtos por categoria.</p>
  </header>
  <main>
    <h2>Produtos</h2>
    <nav id="tabs" class="tabs" aria-label="Categorias de produtos"></nav>
    <p id="status" class="status" role="status" aria-live="polite">Carregando categorias...</p>
    <section id="products" class="products" aria-label="Lista de produtos"></section>
  </main>
  <script>
    const tabs = document.querySelector('#tabs');
    const products = document.querySelector('#products');
    const status = document.querySelector('#status');
    const priceFormat = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    let selected = new URLSearchParams(location.search).get('categoria') || '';
    let categories = [];
    let currentRequest = 0;

    function renderTabs() {
      tabs.replaceChildren();
      for (const category of [{ nome: 'Todos', slug: '' }, ...categories]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = category.nome;
        button.dataset.category = category.slug;
        button.setAttribute('aria-selected', String(category.slug === selected));
        button.addEventListener('click', () => selectCategory(category.slug));
        tabs.append(button);
      }
    }

    function renderProducts(items) {
      products.replaceChildren();
      status.textContent = items.length ? '' : 'Nenhum produto nesta categoria.';
      for (const item of items) {
        const card = document.createElement('article');
        const category = document.createElement('span');
        category.className = 'category';
        category.textContent = item.categoria?.nome || 'Sem categoria';
        const name = document.createElement('h3');
        name.textContent = item.nome;
        const description = document.createElement('p');
        description.textContent = item.descricao || '';
        const price = document.createElement('strong');
        price.className = 'price';
        price.textContent = priceFormat.format(item.preco);
        const availability = document.createElement('p');
        availability.textContent = item.estoque > 0 ? 'Em estoque' : 'Indisponível';
        if (item.estoque <= 0) availability.className = 'out';
        card.append(category, name, description, price, availability);
        products.append(card);
      }
    }

    async function selectCategory(slug, updateUrl = true) {
      selected = slug;
      if (updateUrl) {
        const url = new URL(location.href);
        if (slug) url.searchParams.set('categoria', slug);
        else url.searchParams.delete('categoria');
        history.replaceState(null, '', url);
      }
      renderTabs();
      const request = ++currentRequest;
      products.replaceChildren();
      status.textContent = 'Carregando produtos...';
      try {
        const path = slug ? `/produtos?categoria=${encodeURIComponent(slug)}` : '/produtos';
        const response = await fetch(path);
        if (!response.ok) throw new Error('Falha ao carregar produtos');
        const items = await response.json();
        if (request === currentRequest) renderProducts(items);
      } catch (error) {
        if (request === currentRequest) status.textContent = 'Não foi possível carregar os produtos. Tente escolher a categoria novamente.';
      }
    }

    async function start() {
      try {
        const response = await fetch('/categorias');
        if (!response.ok) throw new Error('Falha ao carregar categorias');
        categories = await response.json();
        if (!categories.some(category => category.slug === selected)) selected = '';
        await selectCategory(selected, false);
      } catch (error) {
        status.textContent = 'Não foi possível carregar o catálogo. Atualize a página para tentar novamente.';
      }
    }
    start();
  </script>
</body>
</html>
