spring.application.name=ecommerce
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ecommerce
app.jwt.ttl-seconds=900
app.frete.valor-padrao=15.00
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/}
app.email.from=${EMAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000
app.digital.storage-path=${DIGITAL_STORAGE_PATH:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.rate-limit.enabled=true
server.max-http-request-header-size=8KB
server.error.include-message=never
spring.jpa.open-in-view=false
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/}
